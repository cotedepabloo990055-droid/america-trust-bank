<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>America Trust Bank — Demo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .app {
      width: min(520px, 100%);
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    header {
      padding: 28px 22px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .demo {
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eef1f5;
      color: #667085;
      font-weight: 700;
    }

    main {
      padding: 0 18px 90px;
    }

    .balance-card {
      border-radius: 24px;
      padding: 27px 24px;
      background: #172033;
      color: white;
      box-shadow: 0 15px 35px rgba(23, 32, 51, .18);
    }

    .balance-label {
      font-size: 14px;
      opacity: .75;
    }

    .balance {
      margin-top: 9px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .account {
      margin-top: 14px;
      font-size: 13px;
      opacity: .65;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0 28px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 15px 8px;
      background: #f0f2f5;
      color: #172033;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    h2 {
      font-size: 19px;
      margin: 0 0 13px;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 4px;
      border-bottom: 1px solid #edf0f3;
    }

    .transaction strong {
      display: block;
      font-size: 15px;
    }

    .transaction span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #7b8494;
    }

    .amount {
      font-weight: 800;
      font-size: 15px;
    }

    .positive { color: #157347; }
    .negative { color: #b42318; }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(255,255,255,.94);
      border-top: 1px solid #e9edf2;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      backdrop-filter: blur(12px);
    }

    nav button {
      background: transparent;
      font-size: 12px;
      color: #667085;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      background: #172033;
      color: white;
      padding: 12px 17px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">America Trust Bank</div>
      <div class="demo">DEMO</div>
    </header>

    <main>
      <section class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance">$100,000,000.00</div>
        <div class="account">Account •••• 4821</div>
      </section>

      <section class="actions">
        <button onclick="showMessage('Send is disabled in this demo.')">Send</button>
        <button onclick="showMessage('Receive is disabled in this demo.')">Receive</button>
        <button onclick="showMessage('Payments are disabled in this demo.')">Pay</button>
      </section>

      <h2>Recent Transactions</h2>

      <div class="transaction">
        <div>
          <strong>Salary Deposit</strong>
          <span>Today • Demo transaction</span>
        </div>
        <div class="amount positive">+$8,500.00</div>
      </div>

      <div class="transaction">
        <div>
          <strong>Online Purchase</strong>
          <span>Yesterday • Demo transaction</span>
        </div>
        <div class="amount negative">−$240.50</div>
      </div>

      <div class="transaction">
        <div>
          <strong>Transfer Received</strong>
          <span>Aug 24 • Demo transaction</span>
        </div>
        <div class="amount positive">+$2,000.00</div>
      </div>
    </main>

    <nav>
      <button onclick="showMessage('Home')">Home</button>
      <button onclick="showMessage('Transactions')">Transactions</button>
      <button onclick="showMessage('Profile')">Profile</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showMessage(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }
  </script>
</body>
</html>
